name: Publish the MCP server

# Pushing a tag v<version> (e.g. v2024.1.6.1) builds, tests and publishes
# io.f1re.ai.mps:mcp-server:<version> to GitHub Packages. Versions are
# immutable there, so every release needs a new tag.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A normal run takes a few minutes; a hung MPS test is cancelled here
    # instead of after GitHub's 6 hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Test the MCP bridge
        run: node --test "scripts/test/*.test.js"

      # The MPS test environment needs an AWT toolkit, even without windows, and
      # forces java.awt.headless itself; a virtual X server provides one.
      - name: Install a virtual X server
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build, run the MPS tests and publish
        run: xvfb-run -a ./gradlew publish -Pversion=${GITHUB_REF_NAME#v}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # As in mbeddr/mps-qa: on a timeout or a manual cancel the JVMs are still
      # alive here, so their stacks show what a hung test is waiting on.
      - name: Dump Java stacks on cancellation
        if: cancelled()
        run: |
          mkdir -p build/hang
          cd build/hang
          jps -mlv > jps.txt
          for pid in $(jps -q); do jstack -l -e "$pid" > "stack-$pid.txt" || true; done

      - name: Upload the Java stacks
        if: cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: java-stacks
          path: build/hang/

      - name: Upload the MPS test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mps-test-reports
          path: code/build/tmp/mpsMcpBackportPlugin/TEST-*.xml
          if-no-files-found: ignore
