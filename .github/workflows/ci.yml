# This is a basic workflow to help you get started with Actions

name: CI - Build and Publish

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events for all branches
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Test the MCP bridge
        run: cd $GITHUB_WORKSPACE && node --test "scripts/test/*.test.js"

      - name: Build the project and run the MPS tests
        run: cd $GITHUB_WORKSPACE && ./gradlew check copyPlugin

      # The test runner writes its JUnit reports here even when tests fail
      # (they are copied to code/TEST-*.xml only after a passing run).
      - name: Upload the MPS test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mps-test-reports
          path: code/build/tmp/mpsMcpBackportPlugin/TEST-*.xml
          if-no-files-found: ignore
      # Runs a single command using the runners shell
      #- name: Run a one-line script
      #   run: echo Hello, world!

      # Runs a set of commands using the runners shell
      #- name: Run a multi-line script
