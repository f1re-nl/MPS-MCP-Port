# This is a basic workflow to help you get started with Actions

name: CI - Build and Publish

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events for all branches
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # A normal run takes a few minutes; a hung MPS test is cancelled here
    # instead of after GitHub's 6 hours.
    timeout-minutes: 10

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Test the MCP bridge
        run: cd $GITHUB_WORKSPACE && node --test "scripts/test/*.test.js"

      - name: Install a virtual X server
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Build the project and run the MPS tests
        run: cd $GITHUB_WORKSPACE && xvfb-run -a ./gradlew

      # As in mbeddr/mps-qa: on a timeout or a manual cancel the JVMs are still
      # alive here, so their stacks show what a hung test is waiting on.
      - name: Dump Java stacks on cancellation
        if: cancelled()
        run: |
          mkdir -p $GITHUB_WORKSPACE/build/hang
          cd $GITHUB_WORKSPACE/build/hang
          jps -mlv > jps.txt
          for pid in $(jps -q); do jstack -l -e "$pid" > "stack-$pid.txt" || true; done

      - name: Upload the Java stacks
        if: cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: java-stacks
          path: build/hang/

      # The test runner writes its JUnit reports here even when tests fail
      # (they are copied to code/TEST-*.xml only after a passing run).
      - name: Upload the MPS test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mps-test-reports
          path: code/build/tmp/mpsMcpBackportPlugin/TEST-*.xml
          if-no-files-found: ignore
